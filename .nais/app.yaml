apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: pam-eures-cv-eksport
  namespace: teampam
  labels:
    team: teampam
spec:
  port: 9030
  liveness:
    path: /pam-eures-cv-eksport/internal/isAlive
    initialDelay: 60
  readiness:
    path: /pam-eures-cv-eksport/internal/isReady
    initialDelay: 60
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  resources:
    limits:
      memory: 2048Mi
    requests:
      cpu: 200m
      memory: 1024Mi
  accessPolicy:
    inbound:
      rules:
        - application: pam-personbruker
        - application: cv
    outbound:
      rules:
        - application: pam-ontologi
  webproxy: false
  envFrom:
    - secret: pam-eures-cv-eksport-secret
  azure:
    application:
      enabled: true
  tokenx:
    enabled: true
  prometheus:
    enabled: true
    path: /pam-eures-cv-eksport/actuator/prometheus
  observability:
    logging:
      destinations:
        - id: loki
        - id: elastic
    autoInstrumentation:
      enabled: true
      runtime: java
  env:
    - name: KAFKA_CONSUMER_TOPIC_CV_ENDRET_INTERN
      value: teampam.cv-endret-intern-v3
    - name: DB_DRIVER
      value: org.postgresql.Driver
    - name: KAFKA_PRODUCER_TOPIC_METRIC_SINK
      value: teampam.metric-sink-v1
